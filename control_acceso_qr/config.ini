; Configuración de la aplicación de Control de Acceso QR
; Las contraseñas NO se guardan aquí: cada usuario inicia sesión con su
; propia cuenta de PostgreSQL.

[base_datos]
host = 127.0.0.1
puerto = 5432
base = grupo_solutions_v2
; Segundos de espera al conectar
tiempo_espera = 5

[lector]
; id del punto de acceso donde está instalada esta computadora
punto_acceso = 1
; 0 = cámara predeterminada; prueben 1 o 2 si tienen varias cámaras
indice_camara = 0
; Segundos que se muestra el resultado antes de volver a leer
pausa_resultado = 2.5
